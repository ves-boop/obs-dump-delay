Help.Text="<h3>Come funziona Dump Delay</h3><table width='100%' cellpadding='8' bgcolor='#6e2020'><tr><td><font color='#ffffff'><b>⚠ Disattiva il Ritardo delle dirette di OBS: non è compatibile con Dump Delay.</b><br>Il ritardo di OBS trattiene i secondi più recenti prima che arrivino a questo plugin, quindi il pulsante antipanico non può eliminarli e arrivano comunque agli spettatori. In OBS <b>Impostazioni → Avanzate → Ritardo delle dirette</b>, togli la spunta da <b>Abilita</b>.</font></td></tr></table><p>I tuoi spettatori vedono la diretta con qualche secondo di ritardo. Se succede qualcosa in diretta, premi il pulsante antipanico: i secondi che gli spettatori non hanno ancora visto vengono eliminati e non arrivano mai a Twitch. Va in onda una scena di attesa mentre il ritardo si ricostruisce, poi torni alla tua scena.</p><h4>Configurazione</h4><ol><li>Configura Twitch (server e chiave della diretta) come al solito in OBS <b>Impostazioni → Dirette</b>.</li><li>Nella scheda <b>Impostazioni</b>, spunta <b>Usa il ritardo di censura per la diretta</b>.</li><li>Scegli o <b>Crea</b> una scena di attesa.</li><li>In OBS <b>Impostazioni → Avanzate → Ritardo delle dirette</b>, assicurati che <b>Abilita</b> non sia spuntato (vedi l'avviso sopra).</li><li>Facoltativo: assegna un tasto in OBS <b>Impostazioni → Scorciatoie → Svuota il buffer di ritardo</b>.</li></ol><h4>In diretta</h4><ul><li>Premi il pulsante <b>PANICONE</b> (o la scorciatoia) entro il tempo di ritardo dall'incidente.</li><li>Gli spettatori vedono un breve fermo immagine, poi la scena di attesa al rallentatore. Tu vedi la scena di attesa per circa il tempo di ritardo, poi OBS torna da solo alla tua scena.</li><li>L'audio è silenziato mentre è in onda la scena di attesa.</li></ul><h4>Da sapere</h4><ul><li>Le impostazioni sono bloccate durante la diretta.</li><li>Salvare modifiche in OBS <b>Impostazioni → Dirette</b> disattiva il ritardo di censura: rimetti la spunta qui.</li><li>La chat non viene ritardata: per quella usa AutoMod, i termini bloccati e il ritardo della chat di Twitch.</li></ul>"
About.Text="<h2>Dump Delay</h2><p>Versione %1</p><p>Ritardo della diretta con pulsante antipanico per OBS Studio.</p><p>Creato da <b>Valerio Enrico Salvo</b> (Ves).</p><p>Distribuito con licenza GNU General Public License, versione 2 o (a tua scelta) qualsiasi versione successiva.</p>"

