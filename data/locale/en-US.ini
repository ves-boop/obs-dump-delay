Help.Text="<h3>How Dump Delay works</h3><table width='100%' cellpadding='8' bgcolor='#6e2020'><tr><td><font color='#ffffff'><b>⚠ Turn off OBS's own Stream Delay: it is not compatible with Dump Delay.</b><br>OBS's delay holds back the newest seconds before they reach this plugin, so the panic button cannot remove them and they still go out to your viewers. In OBS <b>Settings → Advanced → Stream Delay</b>, untick <b>Enable</b>.</font></td></tr></table><p>Your viewers see the stream a few seconds late. If something goes wrong on stream, press the panic button: the seconds your viewers haven't seen yet are thrown away and never reach Twitch. A slate scene goes on air while the delay rebuilds, then you are back to your scene.</p><h4>Setup</h4><ol><li>Set up Twitch (server and stream key) as usual in OBS <b>Settings → Stream</b>.</li><li>In the <b>Settings</b> tab, tick <b>Use dump delay for streaming</b>.</li><li>Pick or <b>Create</b> a slate scene.</li><li>In OBS <b>Settings → Advanced → Stream Delay</b>, make sure <b>Enable</b> is unticked (see the notice above).</li><li>Optional: assign a key in OBS <b>Settings → Hotkeys → Dump delay buffer</b>.</li></ol><h4>On stream</h4><ul><li>Press the <b>PANICONE</b> button (or the hotkey) within the delay time after the problem.</li><li>Viewers see a short freeze, then the slate in slow motion. You see the slate for about the delay time, then OBS switches back to your scene by itself.</li><li>Audio is silenced while the slate is on.</li></ul><h4>Good to know</h4><ul><li>Settings are locked while streaming.</li><li>Saving changes in OBS <b>Settings → Stream</b> turns dump delay off; tick it again here.</li><li>Chat is not delayed: use Twitch's AutoMod, blocked terms and chat delay for that.</li></ul>"
About.Text="<h2>Dump Delay</h2><p>Version %1</p><p>A stream delay with a panic button for OBS Studio.</p><p>Created by <b>Valerio Enrico Salvo</b> (Ves).</p><p>Licensed under the GNU General Public License, version 2 or (at your option) any later version.</p>"

